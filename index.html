<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14211b" />
    <script>try{const p=new URLSearchParams(location.search).get('p');if(p&&p.startsWith('/'))history.replaceState(null,'',p)}catch{}try{const t=localStorage.getItem('lumen-theme')||'system';document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}catch{}</script>
    <title>Lumen — фотостудия</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
